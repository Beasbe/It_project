name: CD (deploy)

# CD: полное развёртывание стека на self-hosted runner (VDS).
# Запускается вручную: Actions -> CD (deploy) -> Run workflow.
# Разворачивает ВСЁ через scripts/deploy.sh: Gateway API CRD + Traefik,
# секреты (SOPS), Prometheus, Grafana, Loki+Fluent Bit, Argo CD (GitOps —
# приложение подтягивается из этого же репозитория, образы из GHCR).
#
# Секреты репозитория:
#   SOPS_AGE_KEY            — приватный age-ключ для helm/secrets/dev.yaml
#   GRAFANA_ADMIN_PASSWORD  — пароль администратора Grafana
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # self-hosted runner (метка по умолчанию `server`); можно переопределить
    # репозиторной переменной RUNNER_LABEL.
    runs-on: ${{ vars.RUNNER_LABEL || 'server' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops + age
        run: |
          sudo curl -sL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          if ! command -v age >/dev/null 2>&1; then
            curl -sL -o /tmp/age.tar.gz \
              https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0.linux-amd64.tar.gz
            sudo tar -xzf /tmp/age.tar.gz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          fi

      - name: Проверка секретов (SOPS)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops -d helm/secrets/dev.yaml > /dev/null && echo "SOPS secrets decrypted OK"

      - name: Deploy (scripts/deploy.sh)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: ./scripts/deploy.sh

      - name: Debug on failure
        if: failure()
        run: |
          echo "========== PODS =========="
          kubectl get pods -A -o wide || true
          echo
          echo "========== EVENTS =========="
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          echo
          echo "========== ARGO CD =========="
          kubectl get application -n argocd -o wide || true
          kubectl -n argocd get secret argocd-initial-admin-secret >/dev/null 2>&1 || echo "argocd initial secret отсутствует"
          echo
          echo "========== DESCRIBE / LOGS full-proj =========="
          for p in $(kubectl get pods -n full-proj -o name 2>/dev/null); do
            echo "----- $p -----"
            kubectl describe "$p" -n full-proj | tail -30
            kubectl logs "$p" -n full-proj --all-containers=true --tail=50 || true
          done
