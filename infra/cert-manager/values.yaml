# cert-manager: автоматическая выдача и продление сертификатов Let's Encrypt.
# Установка (из deploy.sh):
#   helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager \
#     -n cert-manager --create-namespace --version <VERSION> -f infra/cert-manager/values.yaml
# Сертификат на домен выдаётся по ClusterIssuer (infra/cert-manager/clusterissuer.yaml)
# и аннотации на Gateway (cert-manager.io/cluster-issuer); продление — автоматическое.

crds:
  enabled: true

# Включаем интеграцию с Gateway API: gateway-shim (автосоздание Certificate
# из аннотации cert-manager.io/cluster-issuer на Gateway) + HTTP-01 solver
# gatewayHTTPRoute (используется в ClusterIssuer letsencrypt-prod).
# В cert-manager v1.21 feature gate ExperimentalGatewayAPISupport уже включён
# по умолчанию (Beta), но ДОПОЛНИТЕЛЬНО нужен флаг --enable-gateway-api
# (поле GatewayAPIConfig.Enabled, дефолт = false). Без него контроллер
# gateway-shim не стартует и LE-сертификат на домен не выпускается.
extraArgs:
  - --enable-gateway-api=true

# Стартовый api-check не нужен (долго ждёт webhook на слабых VDS)
startupapicheck:
  enabled: false

# Скромные ресурсы — стенд на 3.8 GiB
resources:
  requests:
    cpu: 32m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 16m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 192Mi

cainjector:
  resources:
    requests:
      cpu: 16m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 192Mi
